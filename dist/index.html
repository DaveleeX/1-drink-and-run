<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0b"><meta name="description" content="顶灯下的厚底玻璃杯。探索玻璃折射、湿润黑胡桃木台面和漂浮尘埃。"><title>Nocturne — 午夜吧台</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<main id="scene" aria-label="可以拖动旋转的玻璃杯三维场景"></main>
<div id="loading" role="status"><div class="loading-line"></div><p>正在点亮吧台…</p></div>
<p id="gesture-hint" role="status">拖动环绕 · 双指缩放</p>
<button id="skip-intro" hidden>跳过开场</button>
<nav aria-label="场景控制"><button id="reset" title="恢复初始视角"><span>⌖</span> 复位</button><button id="lightToggle" aria-pressed="true" title="开关顶灯"><span>◐</span> 顶灯</button></nav>
<details id="effects"><summary>调节 <span aria-hidden="true">☷</span></summary><div class="fx-grid"><label>电影调色 <input id="fx-grade" type="range" min="0" max="1" step="0.05" value="0.85" aria-label="电影调色强度，零为原始画面"></label><label><input id="fx-bloom" type="checkbox" checked>柔和辉光</label><label><input id="fx-dof" type="checkbox" checked>景深</label><label><input id="fx-flare" type="checkbox" checked>镜头眩光</label><label>眩光强度 <input id="fx-flare-strength" type="range" min="0" max="1.5" step="0.05" value="0.65"></label></div></details>
<div id="error" role="alert" hidden>这个浏览器暂时无法启动 3D 渲染。请在 Safari 或 Chrome 中重新打开。<button onclick="location.reload()">重试</button></div>
<script type="module" src="./scene.js"></script></body></html>
