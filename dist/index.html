<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171510"><title>江户切子 · 光之器</title><link rel="stylesheet" href="style.css"></head><body><main id="stage" aria-label="江户切子玻璃杯三维预览"></main><div class="shade"></div><header><a class="brand" href="./"><span class="seal">切</span><span>光 之 器<small>THE KIRIKO ATELIER</small></span></a><span class="edition">EDO KIRIKO / STUDY 01</span></header><section class="intro"><div class="eyebrow">江 戸 切 子</div><h1>雕刻光的<br>每一个瞬间。</h1><p>通透的杯壁，繁复的几何切面。<br>转动之间，捕捉一瞬星光。</p><div class="rule"></div><span class="caption">江户切子威士忌杯<br><small>参考造型 · 程序化三维演绎</small></span></section><aside class="tools" aria-label="展示控制"><button id="spin" aria-pressed="true" title="自动旋转"><span>◌</span>旋转</button><button id="close" aria-pressed="false" title="放大切面"><span>⌕</span>细节</button><button id="reset" title="复位视角"><span>↺</span>复位</button></aside><footer><div class="gesture"><span>↔</span> 拖动环绕 <i>·</i> 滚轮 / 双指缩放</div><div class="light"><label for="lighting">光感强度</label><input id="lighting" type="range" min="0.6" max="2" value="1.15" step="0.01"><output id="lightValue">115%</output></div><span class="footer-note">GLASS, CUT INTO LIGHT.</span></footer><div id="loading" role="status">正在唤醒光影…</div><script type="module" src="app.js"></script></body></html>
